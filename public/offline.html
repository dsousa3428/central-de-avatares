<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sem internet · Central de Avatares</title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f5f8; --fg: #14161c; --muted: #5b6272; --card: #ffffff; --line: #e3e5ec; --primary: #4f46e5; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0b0d12; --fg: #eef0f5; --muted: #9aa2b4; --card: #151921; --line: #262b38; --primary: #6366f1; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
      main { width: 100%; max-width: 380px; padding: 28px 24px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); text-align: center; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
      button { width: 100%; height: 44px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem internet</h1>
      <p>O painel precisa de conexão para buscar os seus dados. Confira o Wi-Fi ou os dados do celular e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
