<style>
/* ==========================================================================
   Jornada 60 — visual (tema escuro)
   ========================================================================== */
:root {
  --bg: #0b0e13;
  --surface: #141922;
  --surface-2: #1b2230;
  --surface-3: #243044;
  --line: rgba(255, 255, 255, .09);
  --line-2: rgba(255, 255, 255, .17);
  --text: #eef2f7;
  --text-2: #b8c2d0;
  --muted: #97a3b4;
  --green: #34d399;
  --green-ink: #04231a;
  --green-cell: #1fa672;
  --green-track: #16392c;
  --green-soft: rgba(52, 211, 153, .12);
  --amber: #fbbf24;
  --amber-cell: #c98500;
  --amber-ink: #1f1400;
  --amber-soft: rgba(251, 191, 36, .12);
  --violet: #a78bfa;
  --violet-cell: #8b7be0;
  --violet-soft: rgba(167, 139, 250, .14);
  --coral: #fb7185;
  --coral-ink: #2b0a12;
  --future: #222b3a;
  --erro: #fca5a5;
  --focus: #93c5fd;
  --r-card: 18px;
  --r-btn: 14px;
  --barra: 86px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: dark; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html.travado { overflow: hidden; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.5 var(--font);
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto 0;
  height: 420px;
  background: radial-gradient(900px 380px at 50% -150px, rgba(52, 211, 153, .13), transparent 70%);
  pointer-events: none;
  z-index: 0;
}
h1, h2, h3, p, ul, ol, blockquote, figure, fieldset { margin: 0; padding: 0; }
ul, ol { list-style: none; }
fieldset { border: 0; min-width: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
a { color: var(--green); }
svg { display: block; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

#app { position: relative; z-index: 1; }
.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px 16px calc(var(--barra) + 28px + env(safe-area-inset-bottom, 0px));
}
.app.sem-barra { padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
.entrar { animation: entrar .28s ease both; }
@keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 12px 20px;
  border: 1px solid transparent; border-radius: var(--r-btn);
  background: var(--surface-2); color: var(--text);
  font-weight: 700; font-size: 1rem; line-height: 1.2; text-align: center; text-decoration: none;
  cursor: pointer;
  transition: transform .12s ease, background-color .15s ease, border-color .15s ease, opacity .15s ease;
}
.btn:active { transform: scale(.975); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primario { background: var(--green); color: var(--green-ink); }
.btn.primario:hover { background: #5ee0ad; }
.btn.secundario { background: var(--surface-2); border-color: var(--line-2); }
.btn.secundario:hover { background: var(--surface-3); }
.btn.fantasma { background: transparent; border-color: var(--line-2); color: var(--text-2); }
.btn.fantasma:hover { background: var(--surface-2); color: var(--text); }
.btn.sos { background: var(--coral); color: var(--coral-ink); }
.btn.sos:hover { background: #fd8b9b; }
.btn.ouro { background: var(--amber); color: var(--amber-ink); }
.btn.ouro:hover { background: #fccf55; }
.btn.grande { min-height: 60px; width: 100%; font-size: 1.0625rem; }
.btn.pequeno { min-height: 42px; padding: 8px 14px; font-size: .9rem; font-weight: 600; border-radius: 12px; }
.btn.largo { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.icone-btn {
  display: inline-grid; place-items: center; width: 48px; height: 48px; flex: none;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text-2); cursor: pointer;
  transition: background-color .15s ease, color .15s ease, transform .12s ease;
}
.icone-btn:hover { background: var(--surface-2); color: var(--text); }
.icone-btn:active { transform: scale(.95); }
.icone-btn svg { width: 22px; height: 22px; }
.link-btn { background: none; border: 0; padding: 6px 4px; color: var(--green); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; border-radius: 6px; }

/* ---------- Campos ---------- */
.campo { display: grid; gap: 6px; }
.campo > label, .rotulo { font-weight: 600; font-size: .95rem; color: var(--text); }
.dica { color: var(--muted); font-size: .875rem; }
.erro { color: var(--erro); font-size: .9rem; font-weight: 600; }
input[type="text"], input[type="date"], input[type="number"], input[type="tel"], input[type="url"], textarea {
  width: 100%; min-height: 52px; padding: 12px 14px;
  background: var(--bg); color: var(--text);
  border: 1px solid var(--line-2); border-radius: 12px;
  appearance: none; -webkit-appearance: none;
}
textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: #7b8798; }
input:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.8); cursor: pointer; }
input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--green); flex: none; margin: 1px 0 0; }
.marcar { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }

/* ---------- Cartões ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; }
.card + .card { margin-top: 14px; }
.card h2 { font-size: 1.0625rem; font-weight: 700; letter-spacing: .01em; }
.card .apoio { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.titulo-linha { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* ---------- Topo ---------- */
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 14px; }
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
.marca .logo { width: 34px; height: 34px; flex: none; }
.marca strong { display: block; font-size: 1rem; letter-spacing: .02em; }
.marca span { display: block; color: var(--muted); font-size: .8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.saudacao { font-size: 1.6rem; line-height: 1.2; font-weight: 800; letter-spacing: -.01em; }
.sub { color: var(--text-2); margin-top: 4px; }
.sub b { color: var(--text); }
.cabecalho { margin-bottom: 16px; }

/* ---------- Faixas de aviso ---------- */
.faixa { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--surface-2); margin-bottom: 14px; font-size: .95rem; }
.faixa p { flex: 1 1 220px; }
.faixa .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.faixa.atencao { border-color: rgba(251, 191, 36, .45); background: var(--amber-soft); }
.faixa.teste { border-style: dashed; border-color: rgba(251, 191, 36, .6); background: rgba(251, 191, 36, .08); position: relative; z-index: 2; margin: 0; border-radius: 0; border-width: 0 0 1px; justify-content: center; text-align: center; font-size: .875rem; }
.faixa.teste { padding: 8px 12px; gap: 6px 12px; }
.faixa.teste p { flex: 0 1 auto; }
.faixa.teste .btn { min-height: 40px; padding: 4px 12px; font-size: .82rem; }

/* ---------- Herói: anel de progresso ---------- */
.heroi { display: grid; gap: 16px; justify-items: center; text-align: center; }
.anel { position: relative; width: min(232px, 68vw); aspect-ratio: 1; }
.anel svg { width: 100%; height: 100%; }
.anel .trilho { fill: none; stroke: var(--green-track); stroke-width: 14; }
.anel .progresso { fill: none; stroke: var(--green); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.2, .8, .2, 1); }
.anel .marco { stroke: var(--surface); stroke-width: 2; fill: #6b778a; }
.anel .marco.lib { fill: var(--amber); }
.anel .centro { position: absolute; inset: 0; display: grid; place-content: center; gap: 0; }
.anel .numero { font-size: 4.25rem; line-height: 1; font-weight: 800; letter-spacing: -.03em; }
.anel .rotulo { color: var(--text-2); font-weight: 600; font-size: .95rem; margin-top: 4px; }
.prox { display: grid; gap: 2px; }
.prox .cima { color: var(--text-2); font-size: .95rem; }
.prox .nome { font-size: 1.2rem; font-weight: 700; }
.prox .baixo { color: var(--muted); font-size: .875rem; }

/* ---------- Check-in ---------- */
.checkin .acoes { display: grid; gap: 10px; margin-top: 14px; }
.checkin.feito { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.checkin.feito .selo { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; font-weight: 800; }
.checkin.feito.v .selo { background: var(--green-cell); color: #fff; animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) both; }
.checkin.feito.r .selo { background: var(--violet-cell); color: #fff; }
.checkin.feito .corrigir { grid-column: 1 / -1; justify-self: start; }
.checkin.feito p { color: var(--text-2); font-size: .95rem; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Mensagem do dia ---------- */
.versiculo { border-left: 3px solid var(--green); padding: 2px 0 2px 14px; margin-top: 12px; }
.versiculo p { font-size: 1.0625rem; line-height: 1.55; font-style: italic; color: var(--text); }
.versiculo cite { display: block; margin-top: 6px; font-style: normal; font-weight: 700; color: var(--text-2); font-size: .9rem; }
.texto-msg { margin-top: 12px; color: var(--text); }
.missao { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 4px; }
.missao .etiqueta { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.missao .feita { justify-self: start; margin-top: 6px; }
.missao.ok { border-color: rgba(52, 211, 153, .45); background: var(--green-soft); }
.selo-premio { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 12px; border-radius: 999px; background: var(--amber-soft); border: 1px solid rgba(251, 191, 36, .45); font-weight: 600; font-size: .92rem; }

/* tela cheia (mensagem do dia, pendentes, final) */
.cheia { min-height: calc(100vh - var(--barra) - 60px); min-height: calc(100dvh - var(--barra) - 60px); display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 12px 0; }
.cheia .dia-x { display: inline-flex; align-self: flex-start; padding: 6px 12px; border-radius: 999px; background: var(--green-soft); border: 1px solid rgba(52, 211, 153, .4); font-weight: 700; font-size: .92rem; }
.cheia .saudacao { font-size: 1.9rem; }
.cheia .versiculo p { font-size: 1.25rem; }
.cheia .texto-msg { font-size: 1.0625rem; margin-top: 16px; }

/* ---------- Trilha ---------- */
.trilha { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 14px; }
.cel {
  position: relative; aspect-ratio: 1; min-height: 34px; border: 0; padding: 0;
  display: grid; place-items: center;
  border-radius: 10px; background: var(--future); color: var(--muted);
  font-weight: 700; font-size: .95rem; line-height: 1;
}
button.cel { cursor: pointer; width: 100%; }
button.cel:hover { filter: brightness(1.12); }
.trilha > li:not(.cel) { display: grid; }
.cel .n { position: absolute; top: 4px; left: 6px; font-size: .66rem; font-weight: 700; opacity: .9; }
.cel .i { font-size: 1.05rem; }
.cel .premio { position: absolute; right: 3px; bottom: 2px; font-size: .78rem; line-height: 1; }
.cel.v { background: var(--green-cell); color: #fff; }
.cel.r { background: var(--violet-cell); color: #fff; }
.cel.p { background: var(--amber-cell); color: var(--amber-ink); }
.cel.tem-premio:not(.v):not(.r):not(.p) { background: #2b3040; box-shadow: inset 0 0 0 1.5px rgba(251, 191, 36, .55); }
.cel.tem-premio .i { font-size: 1.2rem; }
.cel.hoje { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text); color: var(--text); }
.cel.hoje.aberto { animation: pulso 2.2s ease-in-out infinite; }
@keyframes pulso { 0%, 100% { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text); } 50% { box-shadow: 0 0 0 2px var(--surface), 0 0 0 7px rgba(238, 242, 247, .35); } }
.anteriores { margin-top: 14px; padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.anteriores .cab { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: .875rem; color: var(--text-2); }
.anteriores .trilha { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.anteriores .cel { min-height: 22px; border-radius: 7px; font-size: .78rem; }
.anteriores .cel .i { font-size: .8rem; }
.legenda { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 14px; color: var(--text-2); font-size: .82rem; }
.legenda li { display: inline-flex; align-items: center; gap: 6px; }
.legenda .am { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; font-size: .7rem; font-weight: 800; background: var(--future); color: var(--muted); }
.legenda .am.v { background: var(--green-cell); color: #fff; }
.legenda .am.r { background: var(--violet-cell); color: #fff; }
.legenda .am.p { background: var(--amber-cell); color: var(--amber-ink); }
.legenda .am.hoje { box-shadow: 0 0 0 1.5px var(--surface), 0 0 0 3px var(--text); width: 14px; height: 14px; margin: 0 2px; }
.legenda .am.g { background: #2b3040; box-shadow: inset 0 0 0 1.5px rgba(251, 191, 36, .55); font-size: .66rem; }

/* ---------- Números ---------- */
.numeros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.num { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.num dt { color: var(--text-2); font-size: .84rem; }
.num dd { margin: 0; font-size: 1.55rem; line-height: 1.2; font-weight: 700; color: var(--text); }
.num dd small { font-size: .84rem; font-weight: 500; color: var(--muted); }
.num.larga { grid-column: 1 / -1; }
.num.larga dd { font-size: 1.2rem; }

/* ---------- Recompensas ---------- */
.secao { margin-top: 26px; }
.secao > .titulo-linha h2 { font-size: 1.25rem; font-weight: 800; }
.premios { display: grid; gap: 12px; margin-top: 14px; }
.premio-card { position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 12px 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; }
.premio-card .emoji { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 1.9rem; line-height: 1; background: var(--surface-2); }
.premio-card .nome { font-weight: 700; font-size: 1.05rem; }
.premio-card .meta { color: var(--text-2); font-size: .9rem; margin-top: 2px; }
.premio-card .estado { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 4px 10px; border-radius: 999px; font-size: .82rem; font-weight: 700; border: 1px solid var(--line-2); color: var(--text-2); }
.premio-card .estado svg { width: 14px; height: 14px; }
.premio-card .acoes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.premio-card .acoes .btn { flex: 1 1 150px; }
.premio-card.bloq .emoji { filter: grayscale(1); opacity: .6; }
.premio-card.lib { border-color: rgba(251, 191, 36, .55); background: linear-gradient(180deg, rgba(251, 191, 36, .10), rgba(251, 191, 36, 0) 70%), var(--surface); }
.premio-card.lib .emoji { background: var(--amber-soft); }
.premio-card.lib .estado { border-color: rgba(251, 191, 36, .6); color: var(--text); }
.premio-card.resg { opacity: .92; }
.premio-card.resg .estado { border-color: rgba(52, 211, 153, .5); color: var(--text); }
.barrinha { height: 6px; border-radius: 999px; background: var(--green-track); margin-top: 10px; overflow: hidden; }
.barrinha i { display: block; height: 100%; border-radius: 999px; background: var(--green); transition: width .6s ease; }
.sugestoes { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--text-2); font-size: .9rem; }
.chip { min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 1px dashed var(--line-2); background: transparent; color: var(--text); font-weight: 600; cursor: pointer; }
.chip:hover { background: var(--surface-2); }
.vazio { padding: 18px; border: 1px dashed var(--line-2); border-radius: var(--r-card); color: var(--text-2); text-align: center; margin-top: 14px; }

.rodape { margin-top: 28px; display: grid; gap: 12px; justify-items: center; text-align: center; color: var(--muted); font-size: .85rem; }
.rodape .acoes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* ---------- Barra fixa: "Estou sendo tentado" ---------- */
.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 62%, rgba(11, 14, 19, 0)); pointer-events: none; }
.barra .btn { pointer-events: auto; max-width: 688px; margin: 0 auto; display: flex; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }

/* ---------- Configuração guiada ---------- */
.guia { max-width: 560px; margin: 0 auto; min-height: calc(100vh - 32px); min-height: calc(100dvh - 32px); display: flex; flex-direction: column; gap: 18px; padding: 8px 0 12px; }
.guia .progresso-guia { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .875rem; }
.guia .progresso-guia .linha { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.guia .progresso-guia .linha i { display: block; height: 100%; background: var(--green); border-radius: 999px; transition: width .35s ease; }
.guia form, .guia .miolo { display: flex; flex-direction: column; gap: 18px; flex: 1; }
.guia h1 { font-size: 1.7rem; line-height: 1.2; font-weight: 800; letter-spacing: -.01em; }
.guia .lead { color: var(--text-2); font-size: 1.05rem; }
.guia .pe { margin-top: auto; display: flex; gap: 10px; padding-top: 10px; }
.guia .pe .btn.primario, .guia .pe .btn.ouro { flex: 1; }
.destaque { padding: 14px; border-radius: 14px; background: var(--green-soft); border: 1px solid rgba(52, 211, 153, .35); }
.destaque b { font-size: 1.1rem; }
.lista-como { display: grid; gap: 12px; }
.lista-como li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.lista-como .bola { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); font-size: 1.2rem; }
.motivos-lista { display: grid; gap: 10px; }
.motivo-linha { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.marcos { display: grid; gap: 10px; }
.marco-linha { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 12px 14px; min-height: 60px; border-radius: 14px; border: 1px dashed var(--line-2); background: transparent; color: var(--text); cursor: pointer; }
.marco-linha:hover { background: var(--surface-2); }
.marco-linha.cheio { border-style: solid; background: var(--surface); }
.marco-linha .dia { font-weight: 800; min-width: 62px; }

function calcular(est, h) {
  var ini = est.perfil.inicio;
  var total = diff(ini, h) + 1;            // dias da jornada que já existem, contando hoje
  var dias = [], seq = 0, recorde = 0, vencidos = 0, recaidas = 0, concluidaEm = null;
  for (var i = 0; i < total; i++) {
    var data = somarDias(ini, i), st = est.checkins[data] || null;
    if (st === 'v') { seq++; vencidos++; }
    else if (st === 'r') { seq = 0; recaidas++; }
    // dia sem resposta: não soma e não zera (a sequência fica como estava)
    if (seq > recorde) recorde = seq;
    dias.push({ data: data, st: st, seq: seq });
    if (seq >= META) { concluidaEm = data; break; }   // a jornada termina aqui
  }
  var naoComecou = total < 1;
  var hojeConta = !concluidaEm && !naoComecou;
  var ultimo = dias.length ? dias[dias.length - 1] : null;
  var seqAtual = ultimo ? ultimo.seq : 0;
  var seqAteOntem = hojeConta ? (dias.length >= 2 ? dias[dias.length - 2].seq : 0) : seqAtual;
  var hojeSt = hojeConta ? (est.checkins[h] || null) : null;
  var pendentes = [];
  dias.forEach(function (d) { if (!d.st && d.data < h) pendentes.push(d.data); });
  var inicioSeq = ini;                      // primeiro dia da sequência atual
  for (var j = dias.length - 1; j >= 0; j--) {
    if (dias[j].st === 'r') { inicioSeq = somarDias(dias[j].data, 1); break; }
  }
  var diaX = Math.min(META, seqAteOntem + 1);   // o dia que estou vivendo
  var previsao;
  if (concluidaEm) previsao = concluidaEm;
  else if (naoComecou) previsao = somarDias(ini, META - 1);
  else if (hojeSt === 'r') previsao = somarDias(h, META);
  else previsao = somarDias(h, META - diaX);
  return {
    dias: dias, naoComecou: naoComecou, concluidaEm: concluidaEm, hojeSt: hojeSt,
    seqAtual: seqAtual, seqAteOntem: seqAteOntem, diaX: diaX,
    recorde: recorde, vencidos: vencidos, recaidas: recaidas,
    pendentes: pendentes, inicioSeq: inicioSeq, previsao: previsao

}

function liberarPorNovosPicos(antes, depois) {
  var seqAntes = {};
  antes.dias.forEach(function (d) { seqAntes[d.data] = d.seq; });
  var novas = [];

    if (r.liberadaEm) return;

      if (d.seq >= r.dia && !jaTinha) { r.liberadaEm = d.data; novas.push(r); break; }

function criarConfete(canvas) {

/* ---------- Dias pendentes ---------- */

function atualizarPendentes() {

/* ---------- Configuração guiada (primeira abertura) ---------- */
var PASSOS = 6;
var MAX_AVANCO = 30;   // o início pode ser até 30 dias à frente
function rasc() {
  if (!estado.rascunho) estado.rascunho = normalizarRascunho({});
  return estado.rascunho;
}
function listaPremios() { return estado.perfil ? estado.recompensas : rasc().recompensas; }
function textoDia60(inicio) {
  var h = hoje(), dia60 = somarDias(inicio, META - 1), atras = diff(inicio, h);
  var s = 'O dia ' + META + ' cai em <b>' + esc(dataExtenso(dia60)) + '</b>.';
  if (atras > 0) s += '<br><span class="dica">Você começou há ' + qtd(atras, 'dia', 'dias') + ': ao terminar, o app pergunta como foi cada um.</span>';
  else if (atras < 0) s += '<br><span class="dica">A jornada começa ' + (atras === -1 ? 'amanhã' : 'em ' + (-atras) + ' dias') + '.</span>';
  else s += '<br><span class="dica">Hoje é o seu Dia 1.</span>';
  return s;
}
function atualizarDia60() {
  var campo = $('#g-inicio'), alvo = $('#g-dia60');
  if (!campo || !alvo) return;
  var d = lerData(campo.value);
  alvo.innerHTML = d ? textoDia60(d) : 'Escolha a data para ver quando cai o dia ' + META + '.';
}
function marcosDoGuia(r) {
  var porDia = {}, dias = MARCOS.slice();
  r.recompensas.forEach(function (x) {
    (porDia[x.dia] = porDia[x.dia] || []).push(x);
    if (dias.indexOf(x.dia) < 0) dias.push(x.dia);
  });
  dias.sort(function (a, b) { return a - b; });
  return dias.map(function (d) {
    var l = porDia[d] || [];
    if (!l.length) {
      return '<li><button type="button" class="marco-linha" data-acao="premio-novo" data-dia="' + d + '"><span class="dia">Dia ' + d +
        '</span><span class="oque">Toque para escolher a recompensa</span>' + IC.mais + '</button></li>';
    }
    return l.map(function (x) {
      return '<li><button type="button" class="marco-linha cheio" data-acao="premio-editar" data-id="' + esc(x.id) + '"><span class="dia">Dia ' + d +
        '</span><span class="oque">' + esc(x.emoji) + ' ' + esc(x.nome) + '</span>' + IC.lapis + '</button></li>';
    }).join('');
  }).join('');
}

function lerPasso() {
  var r = rasc(), el;
  if (r.passo === 1) { el = $('#g-nome'); if (el) r.nome = texto(el.value, 40); }
  else if (r.passo === 2) { el = $('#g-compromisso'); if (el) r.compromisso = texto(el.value, 60); }
  else if (r.passo === 3) { el = $('#g-inicio'); if (el) r.inicio = lerData(el.value); }
  else if (r.passo === 4) {
    var campos = $$('.g-motivo');
    if (campos.length) r.motivos = campos.map(function (i) { return texto(i.value, 200); });
  } else if (r.passo === 5) {
    el = $('#g-conf-nome'); if (el) r.confNome = texto(el.value, 40);
    el = $('#g-conf-whats'); if (el) r.confWhats = texto(el.value, 30);
  }
}
function validarPasso() {
  var r = rasc(), h = hoje();
  if (r.passo === 1 && !r.nome) return 'Escreva como você quer ser chamado.';
  if (r.passo === 3) {
    if (!r.inicio) return 'Escolha uma data válida.';
    if (diff(r.inicio, h) > MAX_RECUO) return 'A data de início pode ser, no máximo, um ano atrás.';
    if (diff(h, r.inicio) > MAX_AVANCO) return 'Escolha uma data de início até ' + MAX_AVANCO + ' dias à frente.';
  }
  if (r.passo === 4 && !r.motivos.filter(Boolean).length) return 'Escreva pelo menos um motivo.';
  if (r.passo === 5 && r.confWhats && !foneWhats(r.confWhats)) return 'Confira o WhatsApp: use o DDD e o número, por exemplo (11) 91234-5678.';
  return '';
}
function mostrarErro(sel, msg, raiz) {
  var p = $(sel, raiz);
  if (!p) return;
  p.textContent = msg;
  p.hidden = !msg;
}
function renderGuia(focoId) {
  render();
  var cont = $('#conteudo');
  if (cont) cont.classList.add('entrar');
  window.scrollTo(0, 0);
  var alvo = (focoId && document.getElementById(focoId)) || $('#conteudo [data-foco]') || $('#titulo');
  if (alvo) { try { alvo.focus({ preventScroll: true }); } catch (e) { /* nada */ } }
}
function concluirConfig() {
  var r = rasc();
  estado.perfil = {
    nome: r.nome || 'Você',
    compromisso: r.compromisso,
    inicio: r.inicio || hoje(),
    motivos: r.motivos.filter(Boolean).slice(0, 5),
    confianca: { nome: r.confNome, whatsapp: r.confWhats }
  };
  estado.recompensas = r.recompensas.map(function (x) {
    return { id: x.id, dia: x.dia, nome: x.nome, link: x.link, preco: x.preco, emoji: x.emoji, liberadaEm: null, resgatadaEm: null };
  });
  estado.rascunho = null;
  estado.criadoEm = hoje();
  salvar();
  pedirArmazenamentoDuravel();
  ui.pendentes = {};
  ir(telaCerta());
}

/* ---------- Backup: exportar e importar ---------- */
function baixarTexto(nome, txt, tipo) {
  try {
    var blob = new Blob([txt], { type: tipo || 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nome; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 2000);
    return true;
  } catch (e) { return false; }
}
function exportar() {
  estado.backup.ultimoEm = hoje();
  estado.backup.lembreteEm = null;
  salvar();
  var txt = JSON.stringify(estado, null, 2), nome = 'jornada60-backup-' + hoje() + '.json';
  var ok = baixarTexto(nome, txt);
  if (estado.perfil && ui.tela !== 'erro') render();
  abrir('<h2>Backup pronto</h2>' +
    '<p>' + (ok ? 'O arquivo <b>' + esc(nome) + '</b> foi para a pasta de downloads deste aparelho.' : 'Este navegador não deixou baixar o arquivo.') +
    ' Guarde uma cópia fora daqui: mande para o seu e-mail, salve na nuvem ou em um pendrive.</p>' +
    '<div class="campo"><label for="x-texto">' + (ok ? 'Não baixou? Copie este texto e guarde em um lugar seguro' : 'Copie este texto e guarde em um lugar seguro') + '</label>' +

    '<div class="dlg-acoes"><button type="button" class="btn secundario" data-acao="copiar-backup">Copiar o texto</button>' +

}
function abrirImportar() {

  abrir('<h2>Restaurar um backup</h2>' +

}
function aplicarBackup(dados) {
  estado = dados;

function receberBackup(txt, form) {

function renderSOS(focoId) {
  if (!sos || !sos.d) return;
  var m = $('#sos-miolo', sos.d);
  if (!m) return;
  var pontos = '';
  for (var i = 1; i <= 6; i++) pontos += '<i class="' + (i <= sos.passo ? 'on' : '') + '"></i>';
  m.innerHTML = (sos.passo <= 6 ? '<div class="sos-topo"><div class="pontos" role="img" aria-label="Passo ' + sos.passo + ' de 6">' + pontos + '</div></div>' : '') +
    '<div class="sos-passo">' + passoSOS() + '</div>';
  var corpo = m.parentNode;
  if (corpo) corpo.scrollTop = 0;
  var alvo = (focoId && $('#' + focoId, sos.d)) || m.querySelector('h2');
  if (alvo) {
    if (alvo.tagName === 'H2') alvo.setAttribute('tabindex', '-1');
    try { alvo.focus({ preventScroll: true }); } catch (e) { /* nada */ }
  }
}
function pararRespiro() {
  if (!sos) return;
  if (sos.relogio) { window.clearInterval(sos.relogio); sos.relogio = 0; }
  sos.respirando = false;
}
function tiqueRespiro() {
  if (!sos || !sos.respirando) return;
  var tempo = $('#tempo', sos.d), fala = $('#fala', sos.d), bolha = $('#bolha', sos.d), leitor = $('#respiro-leitor', sos.d);
  if (!tempo || !fala || !bolha) { pararRespiro(); return; }
  var passou = (Date.now() - sos.inicio) / 1000, resta = Math.max(0, RESPIRO.total - passou);
  var s = Math.ceil(resta);
  tempo.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  if (resta <= 0) {
    pararRespiro();
    sos.terminou = true;
    renderSOS('sos-proximo');
    return;
  }
  var fase = (passou % (RESPIRO.inspirar + RESPIRO.soltar)) < RESPIRO.inspirar ? 'insp' : 'exp';
  if (fase !== sos.fase) {
    sos.fase = fase;
    bolha.className = 'bolha ' + fase;
    fala.textContent = fase === 'insp' ? 'Inspire…' : 'Solte o ar…';
    if (leitor) leitor.textContent = fase === 'insp' ? 'Inspire' : 'Solte o ar';
  }
}
function iniciarRespiro() {
  if (!sos || sos.respirando || sos.passo !== 2) return;
  sos.respirando = true;
  sos.inicio = Date.now();
  sos.fase = '';
  var b = $('#b-respirar', sos.d);
  if (b) { b.textContent = 'Respirando…'; b.disabled = true; }
  tiqueRespiro();
  sos.relogio = window.setInterval(tiqueRespiro, 200);
}

/* ============================================================================
   DESENHAR A TELA E NAVEGAR
   ============================================================================ */
function render() {
  var focoId = document.activeElement && document.activeElement.id;
  var comBarra = !!(estado && estado.perfil) && ui.tela !== 'erro';
  var html = ui.tela === 'erro' ? telaErro()
    : ui.tela === 'config' ? telaConfig()
    : ui.tela === 'pendentes' ? telaPendentes()
    : ui.tela === 'mensagem' ? telaMensagem()
    : ui.tela === 'final' ? telaFinal()
    : telaInicio();
  $('#app').innerHTML = faixaTeste() + '<div class="app' + (ui.tela === 'inicio' ? ' larga' : '') + (comBarra ? '' : ' sem-barra') + '" id="conteudo">' + html + '</div>';
  $('#barra').innerHTML = comBarra
    ? '<div class="barra"><button type="button" class="btn sos grande" id="b-sos" data-acao="sos">' + IC.escudo + 'Estou sendo tentado</button></div>'
    : '';
  if (ui.tela === 'pendentes') atualizarPendentes();
  if (ui.tela === 'inicio') animarAnel();
  if (focoId) {
    var el = document.getElementById(focoId);
    if (el && el !== document.activeElement) { try { el.focus({ preventScroll: true }); } catch (e) { /* nada */ } }
  }
}
// O anel é desenhado no valor anterior e desliza até o novo (microanimação).
function animarAnel() {
  var el = $('#anel-progresso');
  if (!el) return;
  var alvo = Math.max(0, Math.min(1, calc().seqAtual / META));
  if (alvo === ui.anel) return;
  ui.anel = alvo;
  var C = 2 * Math.PI * 92;
  window.requestAnimationFrame(function () {
    window.requestAnimationFrame(function () {
      el.style.opacity = alvo > 0 ? '1' : '0';
      el.style.strokeDashoffset = (C * (1 - alvo)).toFixed(2);
    });
  });
}
function telaCerta() {
  if (!estado.perfil) return 'config';
  var c = calc();
  if (c.concluidaEm) return ui.verInicio ? 'inicio' : 'final';
  if (c.naoComecou) return 'inicio';
  // dias sem resposta vêm antes do check-in de hoje; dá para adiar, mas o check-in fica travado até responder
  if (c.pendentes.length) return ui.adiouPendentes ? 'inicio' : 'pendentes';
  return garantirMensagem(c).vista ? 'inicio' : 'mensagem';
}
function ir(tela) {
  var mudou = ui.tela !== tela;
  ui.tela = tela;
  if (mudou && tela === 'inicio') ui.anel = 0;
  render();
  if (!mudou) return;
  var cont = $('#conteudo');
  if (cont) cont.classList.add('entrar');
  window.scrollTo(0, 0);
  var alvo = $('#conteudo [data-foco]') || $('#titulo');
  if (alvo) { try { alvo.focus({ preventScroll: true }); } catch (e) { /* nada */ } }
  if (tela === 'final') {
    festaGrande(confete, ['🏆', '🎉', '⭐']);
    if (estado.finalVistoEm !== hoje()) { estado.finalVistoEm = hoje(); salvar(); }
  }
}

/* ---------- Virada do dia ---------- */
function aoMudarODia() {
  if (pilha.length) { ui.viradaPendente = true; return; }   // espera a janela aberta fechar
  ui.viradaPendente = false;
  ui.verInicio = false;
  ui.pendentes = {};
  ui.adiouPendentes = false;

  ir(telaCerta());
}
function verificarVirada() {
  if (!estado || ui.tela === 'erro' || !diaConhecido) return false;

  diaConhecido = agora;
  aoMudarODia();
  return true;
}
// Usada antes de gravar um check-in: se o dia virou com o app aberto, atualiza a tela em vez de gravar.
function virou() {
  if (hoje() === diaConhecido) return false;
  verificarVirada();
  avisar('O dia virou. Atualizei a tela: confira antes de marcar.');

}

  sos.escolhida = sos.escolhida === i ? -1 : i;
  renderSOS();
  var b = $$('#sos-saidas .escolha', sos.d)[i];
  if (b) { try { b.focus({ preventScroll: true }); } catch (e) { /* nada */ } }
};
ACOES['sos-editar'] = function () {
  if (!sos) return;
  sos.editando = !sos.editando;
  renderSOS(sos.editando ? 's-nova' : 'sos-editar');
};
ACOES['sos-saida-apagar'] = function (el) {
  if (!sos) return;
  estado.saidas.splice(Number(el.getAttribute('data-i')), 1);
  sos.escolhida = -1;
  salvar();
  renderSOS('s-nova');
};
FORMS['sos-saida'] = function (form) {
  if (!sos) return;
  var t = texto($('#s-nova', form).value, 80);
  if (!t) return;
  if (estado.saidas.length >= 12) { avisar('A lista já tem 12 saídas. Apague uma para adicionar outra.', 'ruim'); return; }
  estado.saidas.push(t);
  salvar();
  renderSOS('s-nova');
};
ACOES['sos-venci'] = function () {
  if (!sos) return;
  estado.tentacoesVencidas++;
  salvar();
  sos.passo = 7;
  renderSOS('sos-fim');
  var tela = $('canvas.confete', sos.d);
  if (tela) { sos.conf = criarConfete(tela); sos.conf.estouro({ n: 120, y: .6, forca: 1.15, emojis: ['🛡️', '💪'] }); }
  if (ui.tela === 'inicio') render();
};

/* modo de teste: andar um dia para a frente ou para trás */
ACOES['teste-dia'] = function (el) {
  if (!MODO_TESTE) return;
  dataSimulada = somarDias(dataSimulada, Number(el.getAttribute('data-n')) || 0);
  try { window.history.replaceState(null, '', '?hoje=' + dataSimulada); } catch (e) { /* alguns navegadores não deixam em arquivo local */ }
  if (!verificarVirada()) render();
};

/* ---------- Ligações com o navegador ---------- */
document.addEventListener('click', function (ev) {
  var alvo = ev.target && ev.target.closest ? ev.target.closest('[data-acao]') : null;
  if (!alvo || alvo.disabled) return;
  var fn = ACOES[alvo.getAttribute('data-acao')];
  if (fn) fn(alvo, ev);
});
document.addEventListener('submit', function (ev) {
  var form = ev.target, nome = form && form.getAttribute ? form.getAttribute('data-form') : null;
  if (!nome) return;
  ev.preventDefault();
  if (FORMS[nome]) FORMS[nome](form, ev);
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t && t.type === 'radio' && t.name && t.name.indexOf('p-') === 0) {
    ui.pendentes[t.name.slice(2)] = t.value;
    atualizarPendentes();
  }
});
document.addEventListener('input', function (ev) {
  if (ev.target && ev.target.id === 'g-inicio') atualizarDia60();
});
// Virada da meia-noite: quando a aba volta ao foco (ou a cada meio minuto), confere se o dia mudou.
document.addEventListener('visibilitychange', function () { if (!document.hidden) verificarVirada(); });
window.addEventListener('focus', verificarVirada);
window.addEventListener('pageshow', verificarVirada);
window.setInterval(verificarVirada, 30000);
// Outra aba do mesmo navegador mudou os dados: recarrega, para uma aba não apagar o que a outra gravou.
window.addEventListener('storage', function (ev) {
  if (ev.key !== CHAVE || ev.newValue == null || ev.newValue === ultimoGravado) return;
  var r = interpretar(ev.newValue);
  if (r.erro) return;
  estado = r.dados;
  ultimoGravado = ev.newValue;
  erroDeCarga = null;
  fecharTodas();
  ui.pendentes = {}; ui.adiouPendentes = false; ui.viradaPendente = false;
  diaConhecido = hoje();
  ir(telaCerta());
  render();
  avisar('Os dados mudaram em outra aba. Atualizei esta tela.');
});

/* ---------- Início ---------- */
function iniciar() {
  confete = criarConfete($('#confete'));
  prepararBanco();
  estado = carregar();
  diaConhecido = hoje();
  if (!estado) {
    ui.tela = 'erro';
    render();
  } else {
    var reabriuComDados = !!estado.perfil && !estado.salvamentoConferido;
    if (reabriuComDados) estado.salvamentoConferido = true;       // os dados sobreviveram a um fechar-e-abrir
    if (estado.perfil && (liberarAlcancadas(calc()).length || reabriuComDados)) salvar();
    ir(telaCerta());
    if (reabriuComDados && !falhaAoSalvar) avisar('Tudo certo: este navegador está guardando o seu progresso.');
  }
  if (MODO_TESTE) {
    // ganchos usados só pelos testes automáticos
    window.__j60 = {
      definirHoje: function (s) { var d = lerData(s); if (d) dataSimulada = d; return dataSimulada; },
      hoje: hoje,
      estado: function () { return JSON.parse(JSON.stringify(estado)); },
      banco: function () { return BANCO; },
      calc: function () { var c = calc(); delete c.dias; return c; },
      util: { somarDias: somarDias, diff: diff, dataValida: dataValida, diaDaSemana: diaDaSemana, calcular: calcular, hojeReal: hojeReal, foneWhats: foneWhats, linkSeguro: linkSeguro, normalizar: normalizar },
      mudarCheckins: mudarCheckins,
      definirEstado: function (o) { estado = normalizar(o); salvar(); ui.pendentes = {}; diaConhecido = hoje(); ir(telaCerta()); render(); }
    };
  }
  window.JORNADA60_OK = true;
}
iniciar();

})();
</script>
